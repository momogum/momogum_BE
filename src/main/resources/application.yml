spring:
  application:
    name: momogum

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  config:
    activate:
      on-profile: local

  data:
    redis:
      host: localhost
      port: 6379
      password:

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/momogum
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          auto: update
        default_batch_fetch_size: 1000
  oauth2:
    kakao:
      client-id: ${KAKAO_CLIENT_ID} # 카카오 REST API 키
      redirect-uri: ${KAKAO_REDIRECT_URI} # 리디렉션 URI
      token-uri: ${KAKAO_TOKEN_URI} # 토큰 발급 URI
      user-info-uri: ${KAKAO_USER_INFO_URI} # 사용자 정보 요청 URI



cloud:
  aws:
    s3:
      bucket: momogum-bucket
    credentials:
      accessKey: ${S3_ACCESSKEY}
      secretKey: ${S3_SECRETKEY}
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false

  logging:
    level:
      root: INFO
      org.springframework.security.oauth2.client: DEBUG
      org.springframework.web: DEBUG

jwt:
  secret: ${JWT_SECRETKEY}

fcm:
  api-url: ${FCM_API_URL}